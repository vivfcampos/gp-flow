<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Login — GP Flow</title>
<link rel="stylesheet" href="/css/base.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--gp-bg-secondary); }
  .gp-login-box { width: 340px; background: #fff; border: 1px solid var(--gp-border); border-radius: var(--gp-radius); padding: 28px; box-shadow: var(--gp-shadow); }
  .gp-login-box h1 { text-align: center; margin-bottom: 20px; }
  .gp-field { margin-bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
  .gp-field label { font-size: 12px; color: var(--gp-text-muted); }
  .gp-field input { width: 100%; }
  .gp-erro { color: #c92a2a; font-size: 12px; margin-bottom: 10px; min-height: 16px; }
</style>
</head>
<body>
  <form class="gp-login-box" id="form-login">
    <h1>🔐 GP Flow</h1>
    <div class="gp-field">
      <label for="usuario">Usuário</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username" required>
    </div>
    <div class="gp-field">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required>
    </div>
    <div class="gp-erro" id="erro"></div>
    <button type="submit" class="primary" style="width:100%;">Entrar</button>
  </form>
  <script src="/js/login.js"></script>
</body>
</html>

databases:
  - name: gpflow-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: gpflow
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gpflow-db
          property: connectionString
      - key: GPFLOW_SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.12"
